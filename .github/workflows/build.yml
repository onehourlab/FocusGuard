# Windows で書いたコードを、GitHub の macOS マシンでテスト・ビルドする。
# push するたびに自動で実行される（署名なし・シミュレータ向け。iPhone への配布は testflight.yml）。
# 失敗した箇所は scripts/ci_annotate.sh が「注釈」として Actions の画面に出す。
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Foundation Models（オンデバイスAI）を含めてビルドするため Xcode 26 が入った macOS 26 を使う
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: echo "::notice::$(xcodebuild -version | tr '\n' ' ') / $(swift --version 2>&1 | head -1)"

      - name: Core tests (FocusGuardKit)
        run: bash scripts/ci_annotate.sh test.log swift test --package-path Packages/FocusGuardKit

      - name: Generate Xcode project
        if: success() || failure()
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app and extensions (iOS Simulator)
        if: success() || failure()
        run: |
          bash scripts/ci_annotate.sh build.log xcodebuild -project FocusGuard.xcodeproj -scheme FocusGuard \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: "*.log"
