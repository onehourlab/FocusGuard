# XcodeGen の設定ファイル。Mac（または GitHub Actions の macOS）で `xcodegen generate` を実行すると
# FocusGuard.xcodeproj が作られる。Bundle ID・App Group・Team はこのファイルだけで変更する。
name: FocusGuard
options:
  bundleIdPrefix: com.onehourlab
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true

settings:
  base:
    # ↓ ご自身の値に変更してください
    DEVELOPMENT_TEAM: ""
    APP_BUNDLE_ID: com.onehourlab.focusguard
    APP_GROUP_ID: group.com.onehourlab.focusguard
    # ↑ ここまで
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"

packages:
  FocusGuardKit:
    path: Packages/FocusGuardKit

# 本体と全拡張で共通の権限（Family Controls と App Group）
targetTemplates:
  FGEntitled:
    entitlements:
      path: ${target_name}/${target_name}.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)

targets:
  FocusGuard:
    type: application
    platform: iOS
    templates: [FGEntitled]
    sources:
      - path: FocusGuard
      - path: Shared
    dependencies:
      - package: FocusGuardKit
      - target: FocusGuardMonitor
      - target: FocusGuardShield
      - target: FocusGuardShieldAction
      - target: FocusGuardReport
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
    info:
      path: FocusGuard/Info.plist
      properties:
        CFBundleDisplayName: Focus Guard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FGAppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # 使用時間のしきい値・期限で再制限する
  FocusGuardMonitor:
    type: app-extension
    platform: iOS
    templates: [FGEntitled]
    sources:
      - path: FocusGuardMonitor
      - path: Shared
    dependencies:
      - package: FocusGuardKit
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
    info:
      path: FocusGuardMonitor/Info.plist
      properties:
        CFBundleDisplayName: Focus Guard Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FGAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FocusMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).monitor
        SKIP_INSTALL: YES

  # ブロック画面の見た目
  FocusGuardShield:
    type: app-extension
    platform: iOS
    templates: [FGEntitled]
    sources:
      - path: FocusGuardShield
    dependencies:
      - package: FocusGuardKit
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
    info:
      path: FocusGuardShield/Info.plist
      properties:
        CFBundleDisplayName: Focus Guard Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FGAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).shield
        SKIP_INSTALL: YES

  # ブロック画面のボタン操作
  FocusGuardShieldAction:
    type: app-extension
    platform: iOS
    templates: [FGEntitled]
    sources:
      - path: FocusGuardShieldAction
      - path: Shared
    dependencies:
      - package: FocusGuardKit
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
    info:
      path: FocusGuardShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Focus Guard Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FGAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).shieldaction
        SKIP_INSTALL: YES

  # 実際の使用時間の表示（データは拡張の外に出ない）
  FocusGuardReport:
    type: app-extension
    platform: iOS
    templates: [FGEntitled]
    sources:
      - path: FocusGuardReport
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: SwiftUI.framework
    info:
      path: FocusGuardReport/Info.plist
      properties:
        CFBundleDisplayName: Focus Guard Report
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).report
        SKIP_INSTALL: YES

schemes:
  FocusGuard:
    build:
      targets:
        FocusGuard: all
        FocusGuardMonitor: all
        FocusGuardShield: all
        FocusGuardShieldAction: all
        FocusGuardReport: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
